# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats054-040
course_id: ATS054
exam_code: CCA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Encrypting Traffic in Transit with Cilium"
questions:
  - id: ats054-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe the WireGuard device and port"
    source_readings:
      - sections/section-040/module-01/course-01-transparent-encryption-with-wireguard.md
    prompt: "Which network device and UDP port does Cilium WireGuard encryption use?"
    options:
      - id: a
        text: "The device `cilium_vxlan` and UDP port 8472."
        explanation: "This is the VXLAN tunnel, not encryption."
      - id: b
        text: "The device `cilium_wg0` and UDP port 51871."
        explanation: "Correct. The agents create the device and the kernel sends encrypted packets on that port."
      - id: c
        text: "The device `cilium_host` and TCP port 4244."
        explanation: "Port 4244 is used by Hubble Relay."
      - id: d
        text: "The device `wg-cilium` and UDP port 500."
        explanation: "Port 500 is IKE, which Cilium does not use."
    correct_option: b
    explanation: "Correct. The agents create the device and the kernel sends encrypted packets on that port."

  - id: ats054-040-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the traffic default encryption does not cover"
    source_readings:
      - sections/section-040/module-01/course-01-transparent-encryption-with-wireguard.md
    prompt: "With WireGuard enabled and no further option, which traffic stays unencrypted?"
    options:
      - id: a
        text: "Traffic between pods on different nodes."
        explanation: "This is the traffic that is encrypted."
      - id: b
        text: "Traffic from a pod to a Service on another node."
        explanation: "After load balancing it is pod-to-pod across nodes and is encrypted."
      - id: c
        text: "Traffic between two pods on the same node."
        explanation: "Correct. Same-node traffic does not leave the node."
      - id: d
        text: "Every request on port 80."
        explanation: "Encryption does not look at ports."
    correct_option: c
    explanation: "Correct. Same-node traffic does not leave the node."

  - id: ats054-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Set up node encryption"
    source_readings:
      - sections/section-040/module-01/course-01-transparent-encryption-with-wireguard.md
    prompt: "Which Helm value adds encryption of traffic between the nodes themselves?"
    options:
      - id: a
        text: "`encryption.nodeEncryption=true`."
        explanation: "Correct. It writes `encrypt-node` to the ConfigMap."
      - id: b
        text: "`encryption.type=node`."
        explanation: "The type is `wireguard` or `ipsec`."
      - id: c
        text: "`hubble.tls.enabled=true`."
        explanation: "This secures Hubble, not node traffic."
      - id: d
        text: "`authentication.enabled=true`."
        explanation: "This turns on mutual authentication."
    correct_option: a
    explanation: "Correct. It writes `encrypt-node` to the ConfigMap."

  - id: ats054-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Build the IPsec key secret"
    source_readings:
      - sections/section-040/module-01/course-02-ipsec-and-choosing-an-encryption-mode.md
    prompt: "In which Secret and format does Cilium read IPsec keys?"
    options:
      - id: a
        text: "A ConfigMap named `cilium-ipsec` with a PEM file."
        explanation: "Keys are stored in a Secret, not as PEM."
      - id: b
        text: "A Secret `ipsec-keys` in the default namespace."
        explanation: "The name and namespace differ."
      - id: c
        text: "A CiliumNetworkPolicy with a `keys` field."
        explanation: "Policies do not hold keys."
      - id: d
        text: "The Secret `cilium-ipsec-keys` in `kube-system`, with a key identifier, algorithm, hexadecimal key and key size."
        explanation: "Correct. The key `keys` holds one line such as `3+ rfc4106(gcm(aes)) <hex> 128`."
    correct_option: d
    explanation: "Correct. The key `keys` holds one line such as `3+ rfc4106(gcm(aes)) <hex> 128`."

  - id: ats054-040-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Rotate an IPsec key"
    source_readings:
      - sections/section-040/module-01/course-02-ipsec-and-choosing-an-encryption-mode.md
    prompt: "How do you rotate the IPsec key without stopping traffic?"
    options:
      - id: a
        text: "Delete the Secret and restart the nodes."
        explanation: "This interrupts traffic."
      - id: b
        text: "Patch the Secret with the key identifier increased by one and a new key."
        explanation: "Correct. Old and new keys exist together during the change."
      - id: c
        text: "Edit the key in place and keep the same identifier."
        explanation: "The identifier tells the agents that a new key exists."
      - id: d
        text: "Change the WireGuard port."
        explanation: "WireGuard is another mode."
    correct_option: b
    explanation: "Correct. Old and new keys exist together during the change."

  - id: ats054-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose between WireGuard and IPsec"
    source_readings:
      - sections/section-040/module-01/course-02-ipsec-and-choosing-an-encryption-mode.md
    prompt: "Which requirement makes IPsec the better choice over WireGuard?"
    options:
      - id: a
        text: "Kernel 5.6 is available on every node."
        explanation: "This makes WireGuard possible."
      - id: b
        text: "The cluster needs host policies."
        explanation: "IPsec does not support host policies."
      - id: c
        text: "A compliance rule that names IPsec."
        explanation: "Correct. The course names compliance rules, old kernels and cloud requirements as reasons."
      - id: d
        text: "The team wants no key handling."
        explanation: "WireGuard handles keys without a Secret."
    correct_option: c
    explanation: "Correct. The course names compliance rules, old kernels and cloud requirements as reasons."

  - id: ats054-040-q07
    type: single_choice
    difficulty: beginner
    learning_objective: "Separate encryption from authentication"
    source_readings:
      - sections/section-040/module-01/course-03-mutual-authentication-with-spiffe-and-spire.md
    prompt: "What does mutual authentication prove?"
    options:
      - id: a
        text: "That the packets are unreadable on the wire."
        explanation: "This is encryption."
      - id: b
        text: "That the request path is allowed."
        explanation: "This is authorization in a policy rule."
      - id: c
        text: "That the node kernel is up to date."
        explanation: "Authentication does not check kernels."
      - id: d
        text: "That both workloads hold a valid identity issued by the trust domain."
        explanation: "Correct. It proves identity and does not hide content."
    correct_option: d
    explanation: "Correct. It proves identity and does not hide content."

  - id: ats054-040-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Ask for authentication in a policy"
    source_readings:
      - sections/section-040/module-01/course-03-mutual-authentication-with-spiffe-and-spire.md
    prompt: "How does a CiliumNetworkPolicy ask for mutual authentication on an ingress rule?"
    options:
      - id: a
        text: "With `authentication: mode: \"required\"` in the rule."
        explanation: "Correct. The agents run the handshake before they allow the flow."
      - id: b
        text: "With the annotation `cilium.io/mtls: true` on the pod."
        explanation: "Policies carry the setting."
      - id: c
        text: "With `encryption: required` on the Service."
        explanation: "Services have no such field."
      - id: d
        text: "With a sidecar in every pod."
        explanation: "Cilium runs the handshake in the agents."
    correct_option: a
    explanation: "Correct. The agents run the handshake before they allow the flow."

  - id: ats054-040-m02-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Read the status
    source_readings:
    - sections/section-040/module-02/course-01-verify-that-wireguard-is-active.md
    prompt: Where does an agent show that WireGuard is active?
    options:
    - id: a
      text: The Encryption line of `cilium-dbg status`
      explanation: Correct. The status line shows the mode, device, port and peers.
    - id: b
      text: The pod log of `scout`
      explanation: Incorrect. The status line shows the mode, device, port and peers.
    - id: c
      text: The Service list
      explanation: Incorrect. The status line shows the mode, device, port and peers.
    - id: d
      text: The Ingress
      explanation: Incorrect. The status line shows the mode, device, port and peers.
    correct_option: a
    explanation: Correct. The status line shows the mode, device, port and peers.
  - id: ats054-040-m02-q02
    type: single_choice
    difficulty: beginner
    learning_objective: Count the peers
    source_readings:
    - sections/section-040/module-02/course-01-verify-that-wireguard-is-active.md
    prompt: How many peers does each agent show in a cluster with two nodes?
    options:
    - id: a
      text: '0'
      explanation: 'Incorrect. Each agent has one peer: the other node.'
    - id: b
      text: '1'
      explanation: 'Correct. Each agent has one peer: the other node.'
    - id: c
      text: '2'
      explanation: 'Incorrect. Each agent has one peer: the other node.'
    - id: d
      text: '3'
      explanation: 'Incorrect. Each agent has one peer: the other node.'
    correct_option: b
    explanation: 'Correct. Each agent has one peer: the other node.'
  - id: ats054-040-m02-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: Prove the traffic
    source_readings:
    - sections/section-040/module-02/course-01-verify-that-wireguard-is-active.md
    prompt: What proves that cross-node traffic uses the WireGuard device?
    options:
    - id: a
      text: A 200 response
      explanation: Incorrect. Unencrypted traffic also gives a 200, so read the counters.
    - id: b
      text: The counters of `cilium_wg0` grow
      explanation: Correct. Unencrypted traffic also gives a 200, so read the counters.
    - id: c
      text: The pod is Ready
      explanation: Incorrect. Unencrypted traffic also gives a 200, so read the counters.
    - id: d
      text: The node is Ready
      explanation: Incorrect. Unencrypted traffic also gives a 200, so read the counters.
    correct_option: b
    explanation: Correct. Unencrypted traffic also gives a 200, so read the counters.
  - id: ats054-040-m02-q04
    type: single_choice
    difficulty: beginner
    learning_objective: Know the gap
    source_readings:
    - sections/section-040/module-02/course-02-node-encryption-and-strict-mode.md
    prompt: What does the default setting NOT encrypt?
    options:
    - id: a
      text: Traffic that starts at a node
      explanation: Correct. Node-originated traffic needs node encryption.
    - id: b
      text: Traffic between pods on different nodes
      explanation: Incorrect. Node-originated traffic needs node encryption.
    - id: c
      text: Requests to scout
      explanation: Incorrect. Node-originated traffic needs node encryption.
    - id: d
      text: Traffic on UDP
      explanation: Incorrect. Node-originated traffic needs node encryption.
    correct_option: a
    explanation: Correct. Node-originated traffic needs node encryption.
  - id: ats054-040-m02-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose strict mode
    source_readings:
    - sections/section-040/module-02/course-02-node-encryption-and-strict-mode.md
    prompt: What does strict mode do?
    options:
    - id: a
      text: Drops traffic that should be encrypted but is not
      explanation: Correct. It drops the packet instead of sending it in the clear.
    - id: b
      text: Encrypts the control plane
      explanation: Incorrect. It drops the packet instead of sending it in the clear.
    - id: c
      text: Disables Hubble
      explanation: Incorrect. It drops the packet instead of sending it in the clear.
    - id: d
      text: Changes the pod CIDR
      explanation: Incorrect. It drops the packet instead of sending it in the clear.
    correct_option: a
    explanation: Correct. It drops the packet instead of sending it in the clear.
  - id: ats054-040-m02-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: Roll out safely
    source_readings:
    - sections/section-040/module-02/course-02-node-encryption-and-strict-mode.md
    prompt: How should you first enable strict mode?
    options:
    - id: a
      text: In a copy of the cluster, watching drops
      explanation: Correct. Traffic fails while a peer is not ready, so test first.
    - id: b
      text: In production at once
      explanation: Incorrect. Traffic fails while a peer is not ready, so test first.
    - id: c
      text: On one pod only
      explanation: Incorrect. Traffic fails while a peer is not ready, so test first.
    - id: d
      text: Without a CIDR
      explanation: Incorrect. Traffic fails while a peer is not ready, so test first.
    correct_option: a
    explanation: Correct. Traffic fails while a peer is not ready, so test first.
  - id: ats054-040-m02-q07
    type: single_choice
    difficulty: beginner
    learning_objective: Name the port
    source_readings:
    - sections/section-040/module-02/course-03-ports-mtu-and-overhead.md
    prompt: Which UDP port does WireGuard use by default in Cilium?
    options:
    - id: a
      text: '51871'
      explanation: 'Correct. The status line shows Port: 51871.'
    - id: b
      text: '443'
      explanation: 'Incorrect. The status line shows Port: 51871.'
    - id: c
      text: '6443'
      explanation: 'Incorrect. The status line shows Port: 51871.'
    - id: d
      text: '8472'
      explanation: 'Incorrect. The status line shows Port: 51871.'
    correct_option: a
    explanation: 'Correct. The status line shows Port: 51871.'
  - id: ats054-040-m02-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: Account for overhead
    source_readings:
    - sections/section-040/module-02/course-03-ports-mtu-and-overhead.md
    prompt: What is the WireGuard overhead over IPv4?
    options:
    - id: a
      text: 60 bytes
      explanation: Correct. The MTU of the pods is lowered by the overhead.
    - id: b
      text: 8 bytes
      explanation: Incorrect. The MTU of the pods is lowered by the overhead.
    - id: c
      text: 200 bytes
      explanation: Incorrect. The MTU of the pods is lowered by the overhead.
    - id: d
      text: 0 bytes
      explanation: Incorrect. The MTU of the pods is lowered by the overhead.
    correct_option: a
    explanation: Correct. The MTU of the pods is lowered by the overhead.
  - id: ats054-040-m02-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: Order the checks
    source_readings:
    - sections/section-040/module-02/course-04-troubleshoot-wireguard.md
    prompt: Which check comes first when encryption does not work?
    options:
    - id: a
      text: Whether the setting is applied in every agent
      explanation: Correct. A ConfigMap value does not apply until the agent restarts.
    - id: b
      text: The MTU
      explanation: Incorrect. A ConfigMap value does not apply until the agent restarts.
    - id: c
      text: Hubble flows
      explanation: Incorrect. A ConfigMap value does not apply until the agent restarts.
    - id: d
      text: The Service type
      explanation: Incorrect. A ConfigMap value does not apply until the agent restarts.
    correct_option: a
    explanation: Correct. A ConfigMap value does not apply until the agent restarts.
  - id: ats054-040-m02-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: Find a missing peer
    source_readings:
    - sections/section-040/module-02/course-04-troubleshoot-wireguard.md
    prompt: A peer shows no recent handshake. What do you check next?
    options:
    - id: a
      text: Whether UDP 51871 is allowed both ways
      explanation: Correct. A blocked port stops the handshake.
    - id: b
      text: The Ingress class
      explanation: Incorrect. A blocked port stops the handshake.
    - id: c
      text: The pod labels
      explanation: Incorrect. A blocked port stops the handshake.
    - id: d
      text: The Helm chart name
      explanation: Incorrect. A blocked port stops the handshake.
    correct_option: a
    explanation: Correct. A blocked port stops the handshake.

  - id: ats054-040-m03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Name the tables
    source_readings:
    - sections/section-040/module-03/course-01-how-cilium-uses-ipsec.md
    prompt: Which two kernel tables hold IPsec state?
    options:
    - id: a
      text: States and policies
      explanation: Correct. XFRM has states (keys, SPIs) and policies.
    - id: b
      text: Routes and rules
      explanation: Incorrect. XFRM has states (keys, SPIs) and policies.
    - id: c
      text: Pods and nodes
      explanation: Incorrect. XFRM has states (keys, SPIs) and policies.
    - id: d
      text: Maps and links
      explanation: Incorrect. XFRM has states (keys, SPIs) and policies.
    correct_option: a
    explanation: Correct. XFRM has states (keys, SPIs) and policies.
  - id: ats054-040-m03-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: Find the key
    source_readings:
    - sections/section-040/module-03/course-01-how-cilium-uses-ipsec.md
    prompt: Where does the agent read the IPsec key from?
    options:
    - id: a
      text: A Kubernetes Secret
      explanation: Correct. The Secret cilium-ipsec-keys holds it.
    - id: b
      text: A ConfigMap
      explanation: Incorrect. The Secret cilium-ipsec-keys holds it.
    - id: c
      text: Hubble
      explanation: Incorrect. The Secret cilium-ipsec-keys holds it.
    - id: d
      text: The node label
      explanation: Incorrect. The Secret cilium-ipsec-keys holds it.
    correct_option: a
    explanation: Correct. The Secret cilium-ipsec-keys holds it.
  - id: ats054-040-m03-q03
    type: single_choice
    difficulty: beginner
    learning_objective: Count the fields
    source_readings:
    - sections/section-040/module-03/course-02-the-key-secret.md
    prompt: How many fields does the key line have?
    options:
    - id: a
      text: Four
      explanation: Correct. SPI, algorithm, key and ICV size.
    - id: b
      text: Two
      explanation: Incorrect. SPI, algorithm, key and ICV size.
    - id: c
      text: Six
      explanation: Incorrect. SPI, algorithm, key and ICV size.
    - id: d
      text: One
      explanation: Incorrect. SPI, algorithm, key and ICV size.
    correct_option: a
    explanation: Correct. SPI, algorithm, key and ICV size.
  - id: ats054-040-m03-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: Size the key
    source_readings:
    - sections/section-040/module-03/course-02-the-key-secret.md
    prompt: How long is the hex key for rfc4106(gcm(aes)) with AES-128?
    options:
    - id: a
      text: 40 characters
      explanation: Correct. 20 bytes written as 40 hex characters.
    - id: b
      text: 16 characters
      explanation: Incorrect. 20 bytes written as 40 hex characters.
    - id: c
      text: 64 characters
      explanation: Incorrect. 20 bytes written as 40 hex characters.
    - id: d
      text: 128 characters
      explanation: Incorrect. 20 bytes written as 40 hex characters.
    correct_option: a
    explanation: Correct. 20 bytes written as 40 hex characters.
  - id: ats054-040-m03-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: Protect it
    source_readings:
    - sections/section-040/module-03/course-02-the-key-secret.md
    prompt: Who can decrypt the traffic if they read the Secret?
    options:
    - id: a
      text: Anyone who has the key
      explanation: Correct. Limit access with RBAC and encrypt Secrets at rest.
    - id: b
      text: Only Cilium
      explanation: Incorrect. Limit access with RBAC and encrypt Secrets at rest.
    - id: c
      text: No one
      explanation: Incorrect. Limit access with RBAC and encrypt Secrets at rest.
    - id: d
      text: Only the node
      explanation: Incorrect. Limit access with RBAC and encrypt Secrets at rest.
    correct_option: a
    explanation: Correct. Limit access with RBAC and encrypt Secrets at rest.
  - id: ats054-040-m03-q06
    type: single_choice
    difficulty: beginner
    learning_objective: Rotate the SPI
    source_readings:
    - sections/section-040/module-03/course-03-rotate-the-keys.md
    prompt: What do you change in the key line to rotate a key?
    options:
    - id: a
      text: The SPI and the key
      explanation: Correct. A new key needs the next SPI.
    - id: b
      text: Only the ICV
      explanation: Incorrect. A new key needs the next SPI.
    - id: c
      text: The Secret name
      explanation: Incorrect. A new key needs the next SPI.
    - id: d
      text: The namespace
      explanation: Incorrect. A new key needs the next SPI.
    correct_option: a
    explanation: Correct. A new key needs the next SPI.
  - id: ats054-040-m03-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: Wrap the SPI
    source_readings:
    - sections/section-040/module-03/course-03-rotate-the-keys.md
    prompt: What happens after SPI 15?
    options:
    - id: a

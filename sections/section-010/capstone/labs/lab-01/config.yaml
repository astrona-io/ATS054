# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Publish Two Services With Cilium Ingress And Gateway API (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-054-capstone-010
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Install Cilium and create the Starfleet workloads
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: ingress-served-by-cilium
      description: "The scout Ingress is owned by Cilium and serves scout.example.com"
      type: file
      source: validation/validate-ingress-served-by-cilium.sh
      hint: "An Ingress without ingressClassName cilium is ignored. Set the class on the existing Ingress."
    - name: route-accepted-by-edge
      description: "The probe HTTPRoute is accepted by the edge Gateway"
      type: file
      source: validation/validate-route-accepted-by-edge.sh
      hint: "The Gateway only accepts routes from namespaces with the label access=gateway. Label the namespace, do not edit the Gateway."
    - name: probe-reachable-through-gateway
      description: "probe.example.com reaches probe through the edge Gateway"
      type: file
      source: validation/validate-probe-reachable-through-gateway.sh
      hint: "After the route is accepted, a request with Host probe.example.com to the Gateway node port must return the probe reply."
    - name: gateway-and-class-unchanged
      description: "The Gateway keeps its namespace selector and the Ingress keeps its rule"
      type: file
      source: validation/validate-gateway-and-class-unchanged.sh
      hint: "Change the class of the Ingress and the namespace labels only."

teardown:
  keepCluster: false

# Starting state: an Ingress that publishes scout and probe.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet
  namespace: starfleet
spec:
  ingressClassName: cilium
  rules:
    - host: fleet.example.com
      http:
        paths:
          - path: /probe
            pathType: Prefix
            backend:
              service:
                name: probe
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scout
                port:
                  number: 80

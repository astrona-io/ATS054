# Knowledge check for section 030. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats054-030
course_id: ATS054
exam_code: CCA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Understand the Benefits of Gateway API over Ingress"
questions:
  - id: ats054-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "List what the Ingress spec can express"
    source_readings:
      - sections/section-030/module-01/course-01-the-limits-of-ingress.md
    prompt: "Which need has no field in the Ingress spec and requires a controller-specific annotation?"
    options:
      - id: a
        text: "Routing by host name."
        explanation: "The `host` field in a rule does this."
      - id: b
        text: "Routing by path prefix."
        explanation: "The `pathType` field supports `Prefix` and `Exact`."
      - id: c
        text: "Matching on a request header."
        explanation: "Correct. The Ingress API ends at host, path, TLS and backend."
      - id: d
        text: "Naming a TLS certificate Secret."
        explanation: "The `tls` list holds this."
    correct_option: c
    explanation: "Correct. The Ingress API ends at host, path, TLS and backend."

  - id: ats054-030-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why one Ingress mixes roles"
    source_readings:
      - sections/section-030/module-01/course-01-the-limits-of-ingress.md
    prompt: "Why can a platform team not give a developer the path rules of an Ingress and keep the certificate for itself?"
    options:
      - id: a
        text: "Both are fields of the same object, and RBAC grants rights per resource kind and namespace."
        explanation: "Correct. The Gateway API splits them into separate resources."
      - id: b
        text: "The Ingress API forbids TLS settings."
        explanation: "The `tls` list is part of the API."
      - id: c
        text: "Cilium ignores RBAC for Ingress."
        explanation: "RBAC applies to every resource."
      - id: d
        text: "Developers cannot create Ingress resources."
        explanation: "They can, which is the problem."
    correct_option: a
    explanation: "Correct. The Gateway API splits them into separate resources."

  - id: ats054-030-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the resource that each role owns"
    source_readings:
      - sections/section-030/module-01/course-02-gateway-api-roles-and-delegation.md
    prompt: "Which resource does the application developer own in the Gateway API?"
    options:
      - id: a
        text: "The GatewayClass."
        explanation: "The infrastructure provider owns it."
      - id: b
        text: "The HTTPRoute."
        explanation: "Correct. The developer owns the matching rules and backends."
      - id: c
        text: "The Gateway."
        explanation: "The cluster operator owns it."
      - id: d
        text: "The ReferenceGrant in the namespace of the Gateway."
        explanation: "A grant is owned by the owner of the target Service."
    correct_option: b
    explanation: "Correct. The developer owns the matching rules and backends."

  - id: ats054-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose an allowedRoutes setting"
    source_readings:
      - sections/section-030/module-01/course-02-gateway-api-roles-and-delegation.md
    prompt: "A listener has no `allowedRoutes` field. Which routes does it accept?"
    options:
      - id: a
        text: "Routes from every namespace."
        explanation: "That needs `from: All`."
      - id: b
        text: "No routes at all."
        explanation: "Routes in its own namespace attach."
      - id: c
        text: "Routes from namespaces with the label `access=gateway`."
        explanation: "That needs `from: Selector`."
      - id: d
        text: "Only routes from the namespace of the Gateway."
        explanation: "Correct. The default is `from: Same`."
    correct_option: d
    explanation: "Correct. The default is `from: Same`."

  - id: ats054-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the reason of a rejected route"
    source_readings:
      - sections/section-030/module-01/course-02-gateway-api-roles-and-delegation.md
    prompt: "An HTTPRoute shows `Accepted=False` with the reason `NotAllowedByListeners`. What do you change?"
    options:
      - id: a
        text: "The `allowedRoutes` of the listener, or the labels of the namespace of the route."
        explanation: "Correct. The Gateway side decides attachment."
      - id: b
        text: "The weight of the backend."
        explanation: "Weights do not affect attachment."
      - id: c
        text: "The `Host` header of the client."
        explanation: "The header affects requests, not the status."
      - id: d
        text: "The IngressClass."
        explanation: "The IngressClass belongs to the Ingress API."
    correct_option: a
    explanation: "Correct. The Gateway side decides attachment."

  - id: ats054-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a ReferenceGrant"
    source_readings:
      - sections/section-030/module-01/course-02-gateway-api-roles-and-delegation.md
    prompt: "A route in `outpost` points to the Service `probe` in `starfleet`, and `ResolvedRefs` shows `RefNotPermitted`. Where do you create the ReferenceGrant?"
    options:
      - id: a
        text: "In the namespace `outpost`."
        explanation: "The referrer cannot grant itself access."
      - id: b
        text: "In the namespace `edge`."
        explanation: "The Gateway namespace has no say over the Service."
      - id: c
        text: "In the namespace `starfleet`, the namespace of the Service."
        explanation: "Correct. The owner of the Service grants access."
      - id: d
        text: "On the Gateway as an annotation."
        explanation: "A grant is a separate resource."
    correct_option: c
    explanation: "Correct. The owner of the Service grants access."

  - id: ats054-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write a header match and a filter"
    source_readings:
      - sections/section-030/module-01/course-03-expressiveness-and-portability.md
    prompt: "Which route field adds a request header before the request reaches the backend?"
    options:
      - id: a
        text: "A `matches` entry with `headers`."
        explanation: "A match selects requests. It does not change them."
      - id: b
        text: "A `RequestHeaderModifier` filter on the rule."
        explanation: "Correct. Filters run in the proxy."
      - id: c
        text: "An annotation on the Gateway."
        explanation: "Standard filters replace annotations."
      - id: d
        text: "A ReferenceGrant."
        explanation: "A grant allows references to Services."
    correct_option: b
    explanation: "Correct. Filters run in the proxy."

  - id: ats054-030-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain what portable means"
    source_readings:
      - sections/section-030/module-01/course-03-expressiveness-and-portability.md
    prompt: "Which statement about portability of a Gateway API route is correct?"
    options:
      - id: a
        text: "Every field works the same in every controller."
        explanation: "Support differs, especially for experimental fields."
      - id: b
        text: "Portability needs annotations per controller."
        explanation: "Annotations are the Ingress approach."
      - id: c
        text: "A route is portable only if it has no filters."
        explanation: "Standard filters are part of the specification."
      - id: d
        text: "Status conditions and fields are defined by the API, but a controller documents which features it supports, and experimental features may be missing."
        explanation: "Correct. Conformance tests and channels describe the limits."
    correct_option: d
    explanation: "Correct. Conformance tests and channels describe the limits."


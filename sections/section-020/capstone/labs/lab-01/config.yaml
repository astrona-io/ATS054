# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Repair Layer 7 Policies Without A Sidecar (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-054-capstone-020
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Install Cilium and create the Starfleet workloads
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: scout-get-allowed-for-both
      description: "shuttle and drifter can send GET / to scout"
      type: file
      source: validation/validate-scout-get-allowed-for-both.sh
      hint: "The scout policy must allow both namespaces. A fromEndpoints entry for another namespace needs the label k8s:io.kubernetes.pod.namespace."
    - name: scout-post-denied
      description: "POST to scout is answered with 403"
      type: file
      source: validation/validate-scout-post-denied.sh
      hint: "Allow only the method GET. Envoy denies every other method with 403."
    - name: probe-shuttle-only
      description: "probe accepts GET /get from shuttle only"
      type: file
      source: validation/validate-probe-shuttle-only.sh
      hint: "The policy applies to the pod port. The pod listens on 8080, not on the Service port 80."
    - name: policies-kept
      description: "The two existing policies are edited, not replaced by an open policy"
      type: file
      source: validation/validate-policies-kept.sh
      hint: "Edit scout-access and probe-access in place. Keep HTTP rules in both."

teardown:
  keepCluster: false

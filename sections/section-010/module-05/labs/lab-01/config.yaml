# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Repair A Broken Gateway Route (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-054-lab-010-05
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Install Cilium and create the Starfleet workloads
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: route-accepted
      description: "The HTTPRoute fleet is Accepted"
      type: file
      source: validation/validate-route-accepted.sh
      hint: "Read the Accepted condition and its reason in status.parents of the route."
    - name: refs-resolved
      description: "The backend reference of the route resolves"
      type: file
      source: validation/validate-refs-resolved.sh
      hint: "Read the ResolvedRefs condition. Compare the backend port with the Service port."
    - name: fleet-reaches-scout
      description: "A request for fleet.example.com reaches scout"
      type: file
      source: validation/validate-fleet-reaches-scout.sh
      hint: "After the route is accepted and resolved, test with curl and the Host header."
    - name: gateway-kept
      description: "The Gateway listener is unchanged"
      type: file
      source: validation/validate-gateway-kept.sh
      hint: "Fix the route and leave the Gateway as it is."

teardown:
  keepCluster: false

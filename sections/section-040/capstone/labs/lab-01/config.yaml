# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Add Node-To-Node Encryption To WireGuard (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-054-capstone-040
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Install Cilium and create the Starfleet workloads
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: node-encryption-enabled
      description: "The ConfigMap enables node-to-node encryption"
      type: file
      source: validation/validate-node-encryption-enabled.sh
      hint: "Set encryption.nodeEncryption=true with helm upgrade --reuse-values, which writes encrypt-node to cilium-config."
    - name: wireguard-still-active
      description: "Every Cilium agent still reports WireGuard"
      type: file
      source: validation/validate-wireguard-still-active.sh
      hint: "Use --reuse-values so that the other Helm values stay. Wait for the agents to roll out."
    - name: helm-values-keep-it
      description: "The Helm release stores nodeEncryption and keeps WireGuard"
      type: file
      source: validation/validate-helm-values-keep-it.sh
      hint: "The change must be in the Helm release, not only in the ConfigMap."
    - name: pod-traffic-works
      description: "Pods still reach scout and probe"
      type: file
      source: validation/validate-pod-traffic-works.sh
      hint: "If requests fail, wait for the rollout and repeat the request."

teardown:
  keepCluster: false

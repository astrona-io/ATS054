    - id: c
      text: It becomes 0
      explanation: Incorrect. The SPI is a number from 1 to 15 and wraps.
    - id: d
      text: It doubles
      explanation: Incorrect. The SPI is a number from 1 to 15 and wraps.
    correct_option: a
    explanation: Correct. The SPI is a number from 1 to 15 and wraps.
  - id: ats054-040-m03-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: Allow the protocol
    source_readings:
    - sections/section-040/module-03/course-04-read-the-state-and-choose-a-mode.md
    prompt: Which traffic must a firewall allow between nodes for IPsec?
    options:
    - id: a
      text: IP protocol 50 (ESP)
      explanation: Correct. ESP is its own IP protocol.
    - id: b
      text: Only TCP 443
      explanation: Incorrect. ESP is its own IP protocol.
    - id: c
      text: Only UDP 53
      explanation: Incorrect. ESP is its own IP protocol.
    - id: d
      text: ICMP
      explanation: Incorrect. ESP is its own IP protocol.
    correct_option: a
    explanation: Correct. ESP is its own IP protocol.
  - id: ats054-040-m03-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose a mode
    source_readings:
    - sections/section-040/module-03/course-04-read-the-state-and-choose-a-mode.md
    prompt: When do you choose IPsec over WireGuard?
    options:
    - id: a
      text: When a rule requires IPsec
      explanation: Correct. Otherwise WireGuard has less to operate.
    - id: b
      text: Always
      explanation: Incorrect. Otherwise WireGuard has less to operate.
    - id: c
      text: When you have one node
      explanation: Incorrect. Otherwise WireGuard has less to operate.
    - id: d
      text: Never
      explanation: Incorrect. Otherwise WireGuard has less to operate.
    correct_option: a
    explanation: Correct. Otherwise WireGuard has less to operate.
  - id: ats054-040-m03-q10
    type: single_choice
    difficulty: advanced
    learning_objective: Read the state
    source_readings:
    - sections/section-040/module-03/course-04-read-the-state-and-choose-a-mode.md
    prompt: Which command lists the keys in use by SPI on an agent?
    options:
    - id: a
      text: "`cilium-dbg encrypt status`"
      explanation: Correct. encrypt status shows keys and error counters.
    - id: b
      text: "`cilium-dbg service list`"
      explanation: Incorrect. encrypt status shows keys and error counters.
    - id: c
      text: "`hubble status`"
      explanation: Incorrect. encrypt status shows keys and error counters.
    - id: d
      text: "`kubectl top`"
      explanation: Incorrect. encrypt status shows keys and error counters.
    correct_option: a
    explanation: Correct. encrypt status shows keys and error counters.

  - id: ats054-040-m04-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Name the authority
    source_readings:
    - sections/section-040/module-04/course-01-the-spire-components.md
    prompt: What does the SPIRE server do?
    options:
    - id: a
      text: Signs the identity documents of a trust domain

# Starting state: a Gateway that accepts only its own namespace, and two routes in other namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: edge
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gw
  namespace: edge
spec:
  gatewayClassName: cilium
  listeners:
    - name: web
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scout
  namespace: starfleet
spec:
  parentRefs:
    - name: edge-gw
      namespace: edge
  hostnames:
    - scout.example.com
  rules:
    - backendRefs:
        - name: scout
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: outpost-probe
  namespace: outpost
spec:
  parentRefs:
    - name: edge-gw
      namespace: edge
  hostnames:
    - outpost.example.com
  rules:
    - backendRefs:
        - name: probe
          namespace: starfleet
          port: 80

# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Restrict The Egress Of A Pod With A CiliumNetworkPolicy (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-054-lab-020-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Install Cilium and create the Starfleet workloads
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: policy-selects-shuttle
      description: "A CiliumNetworkPolicy in starfleet selects the pods with app=shuttle"
      type: file
      source: validation/validate-policy-selects-shuttle.sh
      hint: "Use endpointSelector with matchLabels app: shuttle."
    - name: scout-reachable
      description: "shuttle can still reach scout by name"
      type: file
      source: validation/validate-scout-reachable.sh
      hint: "Allow DNS to kube-dns and TCP 9898 to the scout pods. The Service port 80 maps to the pod port 9898."
    - name: probe-blocked
      description: "shuttle can no longer reach probe"
      type: file
      source: validation/validate-probe-blocked.sh
      hint: "A policy with an egress section denies everything that no rule allows."
    - name: drifter-unaffected
      description: "drifter in outpost still reaches probe"
      type: file
      source: validation/validate-drifter-unaffected.sh
      hint: "Select only shuttle with the policy, not every pod."

teardown:
  keepCluster: false

# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats054-020
course_id: ATS054
exam_code: CCA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "Service Mesh Use Cases"
questions:
  - id: ats054-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Group mesh use cases into traffic management, security and observability"
    source_readings:
      - sections/section-020/module-01/course-01-what-a-service-mesh-does.md
    prompt: "A team wants to see the HTTP status code and latency of each request between two services. Which group of service mesh use cases is this?"
    options:
      - id: a
        text: "Observability."
        explanation: "Correct. Observability answers what happened to a request."
      - id: b
        text: "Traffic management."
        explanation: "Traffic management decides where a request goes."
      - id: c
        text: "Security."
        explanation: "Security decides who may send a request."
      - id: d
        text: "Service discovery."
        explanation: "Service discovery finds the address of a Service. It does not record request details."
    correct_option: a
    explanation: "Correct. Observability answers what happened to a request."

  - id: ats054-020-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the component that applies Layer 7 rules in Cilium"
    source_readings:
      - sections/section-020/module-01/course-01-what-a-service-mesh-does.md
    prompt: "Which component parses HTTP requests and applies Layer 7 rules in Cilium?"
    options:
      - id: a
        text: "The eBPF program on the packet."
        explanation: "eBPF enforces Layer 3 and Layer 4 rules and sends a connection to Envoy when a Layer 7 rule needs it."
      - id: b
        text: "kube-proxy."
        explanation: "Kube-proxy balances Services. It does not parse HTTP."
      - id: c
        text: "The Envoy proxy in the `cilium-envoy` DaemonSet."
        explanation: "Correct. Envoy runs on each node and understands HTTP."
      - id: d
        text: "A sidecar container in each pod."
        explanation: "Cilium does not inject a sidecar into pods."
    correct_option: c
    explanation: "Correct. Envoy runs on each node and understands HTTP."

  - id: ats054-020-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the cheapest component that delivers a use case"
    source_readings:
      - sections/section-020/module-01/course-01-what-a-service-mesh-does.md
    prompt: "A rule must allow pods with the label `app=shuttle` to connect to TCP port 8080 of `probe` and nothing else. Which component enforces it?"
    options:
      - id: a
        text: "Envoy on the node."
        explanation: "Envoy is used only when a rule needs HTTP details."
      - id: b
        text: "eBPF in the kernel, with no Envoy involved."
        explanation: "Correct. A Layer 3 and Layer 4 rule stays in the kernel."
      - id: c
        text: "Hubble Relay."
        explanation: "Hubble observes flows and does not enforce rules."
      - id: d
        text: "The Cilium operator."
        explanation: "The operator manages cluster-wide objects and does not enforce traffic rules."
    correct_option: b
    explanation: "Correct. A Layer 3 and Layer 4 rule stays in the kernel."

  - id: ats054-020-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write an HTTP rule that allows one method and path"
    source_readings:
      - sections/section-020/module-01/course-02-layer-7-access-control-with-ciliumnetworkpolicy.md
    prompt: "Which fragment of a `CiliumNetworkPolicy` allows only `GET /get`?"
    options:
      - id: a
        text: "`ingressDeny` with `method: POST`."
        explanation: "This is a deny rule and does not describe an allow list for GET."
      - id: b
        text: "`endpointSelector` with `path: /get`."
        explanation: "The endpoint selector chooses pods, not requests."
      - id: c
        text: "`fromCIDR` with `/get`."
        explanation: "This field takes an address range."
      - id: d
        text: "`toPorts` with `rules.http` containing `method: GET` and `path: \"/get\"`."
        explanation: "Correct. The HTTP rules sit under `toPorts`."
    correct_option: d
    explanation: "Correct. The HTTP rules sit under `toPorts`."

  - id: ats054-020-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Use the pod port in a policy"
    source_readings:
      - sections/section-020/module-01/course-02-layer-7-access-control-with-ciliumnetworkpolicy.md
    prompt: "The Service `probe` exposes port 80 and its pod listens on 8080. A policy lists `port: \"80\"`. What does a client see?"
    options:
      - id: a
        text: "HTTP 200, because the Service port is used."
        explanation: "Policy applies after the Service is translated to the pod port."
      - id: b
        text: "No reply. The policy applies to the pod port, so traffic to 8080 is not allowed and the kernel drops it."
        explanation: "Correct. The client sees a timeout."
      - id: c
        text: "HTTP 403 from Envoy."
        explanation: "Envoy answers 403 only for allowed connections with a denied request."
      - id: d
        text: "HTTP 404 from the pod."
        explanation: "The connection never reaches the pod."
    correct_option: b
    explanation: "Correct. The client sees a timeout."

  - id: ats054-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Distinguish the outcomes of a denied request"
    source_readings:
      - sections/section-020/module-01/course-02-layer-7-access-control-with-ciliumnetworkpolicy.md
    prompt: "A client is allowed to connect to `probe` but sends `GET /uuid` while the rule allows only `/get`. What does it receive?"
    options:
      - id: a
        text: "No reply."
        explanation: "No reply means a Layer 3 or Layer 4 drop in the kernel."
      - id: b
        text: "HTTP 404 from the pod."
        explanation: "The request never reaches the pod."
      - id: c
        text: "HTTP 403 from Envoy."
        explanation: "Correct. The connection is allowed, and Envoy denies the request."
      - id: d
        text: "HTTP 200."
        explanation: "The rule does not allow this path."
    correct_option: c
    explanation: "Correct. The connection is allowed, and Envoy denies the request."

  - id: ats054-020-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read Hubble flow verdicts"
    source_readings:
      - sections/section-020/module-01/course-03-observing-service-traffic-with-hubble.md
    prompt: "Which Hubble command shows only the flows that Cilium dropped in the namespace `starfleet`?"
    options:
      - id: a
        text: "`hubble observe --namespace starfleet --verdict DROPPED`"
        explanation: "Correct. The filters combine."
      - id: b
        text: "`hubble observe --protocol http --verdict FORWARDED`"
        explanation: "This shows forwarded HTTP flows."
      - id: c
        text: "`hubble status`"
        explanation: "This shows the state of Hubble, not flows."
      - id: d
        text: "`kubectl get ciliumnetworkpolicy`"
        explanation: "This lists policies, not flows."
    correct_option: a
    explanation: "Correct. The filters combine."

  - id: ats054-020-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain when Hubble sees HTTP details"
    source_readings:
      - sections/section-020/module-01/course-03-observing-service-traffic-with-hubble.md
    prompt: "Hubble shows Layer 4 flows for `scout`, but no HTTP fields. Why?"
    options:
      - id: a
        text: "Hubble Relay is not running."
        explanation: "Without Relay the cluster-wide view fails, but the agent still shows flows."
      - id: b
        text: "HTTP is encrypted by default."
        explanation: "Cilium does not encrypt HTTP by default."
      - id: c
        text: "Hubble cannot show HTTP."
        explanation: "Hubble shows HTTP for traffic that Envoy handles."
      - id: d
        text: "No Layer 7 rule selects that traffic, so Envoy does not handle it and records no HTTP details."
        explanation: "Correct. HTTP details come from Envoy."
    correct_option: d
    explanation: "Correct. HTTP details come from Envoy."

  - id: ats054-020-m02-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Compare balancing levels
    source_readings:
    - sections/section-020/module-02/course-01-layer-7-load-balancing-with-an-annotation.md
    prompt: How does kernel load balancing pick a backend?
    options:
    - id: a
      text: Per request
      explanation: Incorrect. The kernel picks a backend when a connection opens.
    - id: b
      text: Per connection
      explanation: Correct. The kernel picks a backend when a connection opens.
    - id: c
      text: Per byte
      explanation: Incorrect. The kernel picks a backend when a connection opens.
    - id: d
      text: Per minute
      explanation: Incorrect. The kernel picks a backend when a connection opens.
    correct_option: b
    explanation: Correct. The kernel picks a backend when a connection opens.
  - id: ats054-020-m02-q02
    type: single_choice
    difficulty: beginner
    learning_objective: Know the annotation
    source_readings:
    - sections/section-020/module-02/course-01-layer-7-load-balancing-with-an-annotation.md
    prompt: Which annotation hands a Service to the Cilium Envoy proxy?
    options:
    - id: a
      text: "`service.cilium.io/lb-l7: enabled`"
      explanation: Correct. service.cilium.io/lb-l7 set to enabled turns on Layer 7
        balancing.
    - id: b
      text: "`cilium.io/envoy: true`"
      explanation: Incorrect. service.cilium.io/lb-l7 set to enabled turns on Layer
        7 balancing.
    - id: c
      text: "`service.kubernetes.io/l7: on`"
      explanation: Incorrect. service.cilium.io/lb-l7 set to enabled turns on Layer
        7 balancing.
    - id: d
      text: "`io.cilium/proxy: envoy`"
      explanation: Incorrect. service.cilium.io/lb-l7 set to enabled turns on Layer
        7 balancing.
    correct_option: a
    explanation: Correct. service.cilium.io/lb-l7 set to enabled turns on Layer 7 balancing.
  - id: ats054-020-m02-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: Find the prerequisite
    source_readings:
    - sections/section-020/module-02/course-01-layer-7-load-balancing-with-an-annotation.md
    prompt: What must be set in Helm for the annotation to work?
    options:
    - id: a
      text: "`loadBalancer.l7.backend=envoy`"
      explanation: Correct. The Layer 7 backend must be envoy, or the annotation is
        ignored.
    - id: b
      text: "`bpf.masquerade=false`"
      explanation: Incorrect. The Layer 7 backend must be envoy, or the annotation is
        ignored.
    - id: c
      text: "`ipam.mode=cluster-pool`"
      explanation: Incorrect. The Layer 7 backend must be envoy, or the annotation is
        ignored.
    - id: d
      text: "`tls.enabled=true`"
      explanation: Incorrect. The Layer 7 backend must be envoy, or the annotation is
        ignored.
    correct_option: a
    explanation: Correct. The Layer 7 backend must be envoy, or the annotation is ignored.
  - id: ats054-020-m02-q04
    type: single_choice
    difficulty: beginner
    learning_objective: List algorithms
    source_readings:
    - sections/section-020/module-02/course-02-choose-a-balancing-algorithm.md
    prompt: Which is NOT a valid value of service.cilium.io/lb-l7-algorithm?
    options:
    - id: a
      text: "`round_robin`"
      explanation: Incorrect. The values are round_robin, least_request and random.
    - id: b
      text: "`least_request`"
      explanation: Incorrect. The values are round_robin, least_request and random.
    - id: c
      text: "`random`"
      explanation: Incorrect. The values are round_robin, least_request and random.
    - id: d
      text: "`sticky`"
      explanation: Correct. The values are round_robin, least_request and random.
    correct_option: d
    explanation: Correct. The values are round_robin, least_request and random.
  - id: ats054-020-m02-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose least_request
    source_readings:
    - sections/section-020/module-02/course-02-choose-a-balancing-algorithm.md
    prompt: When does least_request fit best?
    options:
    - id: a
      text: Requests are equal in cost.
      explanation: Incorrect. It avoids sending new requests to a backend that is busy
        with slow ones.
    - id: b
      text: Some requests take much longer than others.
      explanation: Correct. It avoids sending new requests to a backend that is busy
        with slow ones.
    - id: c
      text: The Service has one pod.
      explanation: Incorrect. It avoids sending new requests to a backend that is busy
        with slow ones.
    - id: d
      text: The traffic is UDP.
      explanation: Incorrect. It avoids sending new requests to a backend that is busy
        with slow ones.
    correct_option: b
    explanation: Correct. It avoids sending new requests to a backend that is busy with
      slow ones.
  - id: ats054-020-m02-q06
    type: single_choice
    difficulty: beginner
    learning_objective: Name the Envoy objects
    source_readings:
    - sections/section-020/module-02/course-03-ciliumenvoyconfig-anatomy.md
    prompt: In what order does a request pass the Envoy objects of a CiliumEnvoyConfig?
    options:
    - id: a
      text: Cluster, route, listener
      explanation: Incorrect. The listener accepts, the route configuration matches,
        the cluster holds the endpoints.
    - id: b
      text: Listener, route configuration, cluster
      explanation: Correct. The listener accepts, the route configuration matches, the
        cluster holds the endpoints.
    - id: c
      text: Route, cluster, listener
      explanation: Incorrect. The listener accepts, the route configuration matches,
        the cluster holds the endpoints.
    - id: d
      text: Listener, cluster, route configuration
      explanation: Incorrect. The listener accepts, the route configuration matches,
        the cluster holds the endpoints.
    correct_option: b
    explanation: Correct. The listener accepts, the route configuration matches, the
      cluster holds the endpoints.
  - id: ats054-020-m02-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: Tell apart scopes
    source_readings:
    - sections/section-020/module-02/course-03-ciliumenvoyconfig-anatomy.md
    prompt: What is the difference between CiliumEnvoyConfig and CiliumClusterwideEnvoyConfig?
    options:
    - id: a
      text: The first is namespaced and the second applies cluster-wide.
      explanation: Correct. One lives in a namespace and the other has no namespace.
    - id: b
      text: The first is for TCP and the second for HTTP.
      explanation: Incorrect. One lives in a namespace and the other has no namespace.
    - id: c
      text: The first is read-only.
      explanation: Incorrect. One lives in a namespace and the other has no namespace.
    - id: d
      text: There is none.
      explanation: Incorrect. One lives in a namespace and the other has no namespace.
    correct_option: a
    explanation: Correct. One lives in a namespace and the other has no namespace.
  - id: ats054-020-m02-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: Avoid editing generated config
    source_readings:
    - sections/section-020/module-02/course-03-ciliumenvoyconfig-anatomy.md
    prompt: Why not edit a CiliumEnvoyConfig that Cilium generated?
    options:
    - id: a
      text: It is read-only in the API.
      explanation: Incorrect. A generated configuration is reconciled by the controller.
    - id: b
      text: The controller owns it and overwrites your change.
      explanation: Correct. A generated configuration is reconciled by the controller.
    - id: c
      text: Envoy ignores edits.
      explanation: Incorrect. A generated configuration is reconciled by the controller.
    - id: d
      text: It needs a restart.
      explanation: Incorrect. A generated configuration is reconciled by the controller.
    correct_option: b
    explanation: Correct. A generated configuration is reconciled by the controller.
  - id: ats054-020-m02-q09
    type: single_choice
    difficulty: beginner
    learning_objective: Pick a tool
    source_readings:
    - sections/section-020/module-02/course-04-weights-retries-and-when-to-use-which-tool.md
    prompt: Which tool fits north-south routing with weights and filters?
    options:
    - id: a
      text: Gateway API
      explanation: Correct. The Gateway API is the portable and supported way.
    - id: b
      text: A hand-written CiliumEnvoyConfig only
      explanation: Incorrect. The Gateway API is the portable and supported way.
    - id: c
      text: kube-proxy
      explanation: Incorrect. The Gateway API is the portable and supported way.
    - id: d
      text: A NodePort Service
      explanation: Incorrect. The Gateway API is the portable and supported way.
    correct_option: a
    explanation: Correct. The Gateway API is the portable and supported way.
  - id: ats054-020-m02-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: Be careful with retries
    source_readings:
    - sections/section-020/module-02/course-04-weights-retries-and-when-to-use-which-tool.md
    prompt: Why use retries only for some requests?
    options:
    - id: a
      text: Retries repeat the request, so it must be safe to repeat.
      explanation: Correct. A repeated request that is not idempotent may run twice.
    - id: b
      text: Envoy cannot retry.
      explanation: Incorrect. A repeated request that is not idempotent may run twice.
    - id: c
      text: Retries need TLS.
      explanation: Incorrect. A repeated request that is not idempotent may run twice.
    - id: d
      text: Retries change the Host header.
      explanation: Incorrect. A repeated request that is not idempotent may run twice.
    correct_option: a
    explanation: Correct. A repeated request that is not idempotent may run twice.

  - id: ats054-020-m03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Know when deny starts
    source_readings:
    - sections/section-020/module-03/course-01-default-deny-and-identity-based-rules.md
    prompt: When does a pod enter default deny for ingress?
    options:
    - id: a
      text: Always.
      explanation: Incorrect. A pod is restricted in a direction once a policy selects
        it and has a section for that direction.
    - id: b
      text: When a policy selects it and has an ingress section.
      explanation: Correct. A pod is restricted in a direction once a policy selects
        it and has a section for that direction.
    - id: c
      text: When it has a label.
      explanation: Incorrect. A pod is restricted in a direction once a policy selects
        it and has a section for that direction.
    - id: d
      text: When its namespace has an annotation.
      explanation: Incorrect. A pod is restricted in a direction once a policy selects
        it and has a section for that direction.
    correct_option: b
    explanation: Correct. A pod is restricted in a direction once a policy selects it
      and has a section for that direction.
  - id: ats054-020-m03-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: Use the pod port
    source_readings:
    - sections/section-020/module-03/course-01-default-deny-and-identity-based-rules.md
    prompt: A Service listens on 80 and forwards to pod port 9898. Which port does the
      policy name?
    options:
    - id: a
      text: '80'
      explanation: Incorrect. Cilium checks the policy after the Service is translated
        to a pod.
    - id: b
      text: '9898'
      explanation: Correct. Cilium checks the policy after the Service is translated
        to a pod.
    - id: c
      text: '443'
      explanation: Incorrect. Cilium checks the policy after the Service is translated
        to a pod.
    - id: d
      text: Both
      explanation: Incorrect. Cilium checks the policy after the Service is translated
        to a pod.
    correct_option: b
    explanation: Correct. Cilium checks the policy after the Service is translated to
      a pod.
  - id: ats054-020-m03-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain a timeout
    source_readings:
    - sections/section-020/module-03/course-01-default-deny-and-identity-based-rules.md
    prompt: A client calls a pod that a policy protects and gets no reply. What happened?
    options:
    - id: a
      text: The packet was dropped.
      explanation: Correct. A dropped packet gives no reply, so the client times out.
    - id: b
      text: The Service was deleted.
      explanation: Incorrect. A dropped packet gives no reply, so the client times out.
    - id: c
      text: DNS failed with NXDOMAIN.
      explanation: Incorrect. A dropped packet gives no reply, so the client times out.
    - id: d
      text: Envoy returned 403.
      explanation: Incorrect. A dropped packet gives no reply, so the client times out.
    correct_option: a
    explanation: Correct. A dropped packet gives no reply, so the client times out.
  - id: ats054-020-m03-q04
    type: single_choice
    difficulty: beginner
    learning_objective: Name an entity
    source_readings:
    - sections/section-020/module-03/course-02-egress-to-names-and-entities.md
    prompt: Which entity means everything outside the cluster?
    options:
    - id: a
      text: "`world`"
      explanation: Correct. world is outside the cluster.
    - id: b
      text: "`host`"
      explanation: Incorrect. world is outside the cluster.
    - id: c
      text: "`ingress`"
      explanation: Incorrect. world is outside the cluster.
    - id: d
      text: "`cluster`"
      explanation: Incorrect. world is outside the cluster.
    correct_option: a
    explanation: Correct. world is outside the cluster.
  - id: ats054-020-m03-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: Make toFQDNs work
    source_readings:
    - sections/section-020/module-03/course-02-egress-to-names-and-entities.md
    prompt: What does toFQDNs need besides the name rule?
    options:
    - id: a
      text: A DNS rule that inspects lookups
      explanation: Correct. Cilium learns the addresses from the DNS answer in its proxy.
    - id: b
      text: A NodePort
      explanation: Incorrect. Cilium learns the addresses from the DNS answer in its
        proxy.
    - id: c
      text: A Gateway
      explanation: Incorrect. Cilium learns the addresses from the DNS answer in its
        proxy.
    - id: d
      text: A SPIRE server
      explanation: Incorrect. Cilium learns the addresses from the DNS answer in its
        proxy.
    correct_option: a
    explanation: Correct. Cilium learns the addresses from the DNS answer in its proxy.
  - id: ats054-020-m03-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: Spot a weak pattern
    source_readings:
    - sections/section-020/module-03/course-02-egress-to-names-and-entities.md
    prompt: Why is matchPattern '*' a poor choice for egress?
    options:
    - id: a
      text: It is not valid YAML.
      explanation: Incorrect. A wildcard of all names defeats the purpose.
    - id: b
      text: It allows every name.
      explanation: Correct. A wildcard of all names defeats the purpose.
    - id: c
      text: It blocks DNS.
      explanation: Incorrect. A wildcard of all names defeats the purpose.
    - id: d
      text: It only works for UDP.
      explanation: Incorrect. A wildcard of all names defeats the purpose.
    correct_option: b
    explanation: Correct. A wildcard of all names defeats the purpose.
  - id: ats054-020-m03-q07
    type: single_choice
    difficulty: beginner
    learning_objective: Know the winner
    source_readings:
    - sections/section-020/module-03/course-03-deny-rules-and-policy-precedence.md
    prompt: A deny rule and an allow rule both match. What happens?
    options:
    - id: a
      text: Allowed
      explanation: Incorrect. Deny wins over allow.
    - id: b
      text: Dropped
      explanation: Correct. Deny wins over allow.
    - id: c
      text: Random
      explanation: Incorrect. Deny wins over allow.
    - id: d
      text: Logged only
      explanation: Incorrect. Deny wins over allow.
    correct_option: b
    explanation: Correct. Deny wins over allow.
  - id: ats054-020-m03-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: Predict a deny-only policy
    source_readings:
    - sections/section-020/module-03/course-03-deny-rules-and-policy-precedence.md
    prompt: A policy has only ingressDeny. Does it turn on default deny for other callers?
    options:
    - id: a
      text: Yes, for all callers.
      explanation: Incorrect. A deny-only policy blocks the denied traffic and leaves
        the rest as it was.
    - id: b
      text: No, others are not affected.
      explanation: Correct. A deny-only policy blocks the denied traffic and leaves
        the rest as it was.
    - id: c
      text: Only for TCP.
      explanation: Incorrect. A deny-only policy blocks the denied traffic and leaves
        the rest as it was.
    - id: d
      text: Only in the same namespace.
      explanation: Incorrect. A deny-only policy blocks the denied traffic and leaves
        the rest as it was.
    correct_option: b
    explanation: Correct. A deny-only policy blocks the denied traffic and leaves the
      rest as it was.
  - id: ats054-020-m03-q09
    type: single_choice
    difficulty: beginner
    learning_objective: Find the field
    source_readings:

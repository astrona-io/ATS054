# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Turn On WireGuard Encryption (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-054-lab-040-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Install Cilium and create the Starfleet workloads
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: wireguard-configured
      description: "The Cilium ConfigMap enables WireGuard"
      type: file
      source: validation/validate-wireguard-configured.sh
      hint: "Set enable-wireguard to \"true\" in the ConfigMap cilium-config in kube-system."
    - name: agents-report-wireguard
      description: "Every Cilium agent reports WireGuard encryption"
      type: file
      source: validation/validate-agents-report-wireguard.sh
      hint: "The agents read the ConfigMap at start. Restart the DaemonSet cilium and wait for it to roll out."
    - name: pod-traffic-works
      description: "Pods on both nodes still reach scout and probe"
      type: file
      source: validation/validate-pod-traffic-works.sh
      hint: "Encryption is transparent. If requests fail, check that the rollout finished."

teardown:
  keepCluster: false

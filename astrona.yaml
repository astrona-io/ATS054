# Course manifest for ATS054 - Service Mesh (Cilium Certified Associate).
#
# One entry per section under `modules:`. Each section lists its README, the
# module landing page (course.md), the parts (course-0N-*.md), the lab right
# after the part it practises (question.md reading plus the `type: lab`
# entry), the module summary, the section capstone and the knowledge check.
# Playgrounds are not listed: the landing page's playground marker shows them.
# solution.md is never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS054
  title: 'CCA: Service Mesh'
  description: 'Training material covering the Cilium Certified Associate (CCA) Service
    Mesh domain: Ingress and Gateway API routing with Cilium, service mesh use cases
    such as Layer 7 access control and observation, the benefits of the Gateway API
    over Ingress, encryption in transit with WireGuard and IPsec plus mutual authentication,
    and sidecar versus sidecarless architectures. Each module pairs a layered reader
    with an ungraded playground and a graded lab, and each section closes with an
    integration capstone and a knowledge check. Labs are untested and checked statically
    only.'
  certification:
    name: Cilium Certified Associate
    code: CCA
    provider: CNCF / Linux Foundation
    domain: Service Mesh
    weight: 16
    competencies:
    - Know How to use Ingress or Gateway API for Ingress Routing
    - Service Mesh Use Cases
    - Understand the Benefits of Gateway API over Ingress
    - Encrypting Traffic in Transit with Cilium
    - Sidecar-based versus Sidecarless Architectures
modules:
- id: module-intro
  title: Introduction
  description: Audience, reading method and review process.
  content:
  - type: reading
    title: Introduction
    path: sections/intro/README.md
  - type: reading
    title: Welcome To The Course
    path: sections/intro/course-01-welcome.md
  - type: reading
    title: Get Your Machine Ready
    path: sections/intro/course-02-get-your-machine-ready.md
  - type: reading
    title: How This Course Is Made
    path: sections/intro/course-03-how-this-course-is-made.md

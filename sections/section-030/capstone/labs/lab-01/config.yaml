# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Share A Backend Across Namespaces With A Gateway (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-054-capstone-030
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Install Cilium and create the Starfleet workloads
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: route-accepted-and-resolved
      description: "The HTTPRoute probe in outpost is accepted and its backend resolves"
      type: file
      source: validation/validate-route-accepted-and-resolved.sh
      hint: "Two conditions fail: the namespace is not allowed by the Gateway and the backend lives in another namespace without a grant."
    - name: probe-reachable-through-gateway
      description: "probe.example.com reaches probe through the edge Gateway"
      type: file
      source: validation/validate-probe-reachable-through-gateway.sh
      hint: "After both conditions are true, a request with Host probe.example.com to the Gateway node port must return the probe reply."
    - name: grant-is-narrow
      description: "A ReferenceGrant in starfleet allows only HTTPRoutes from outpost to reach the Service probe"
      type: file
      source: validation/validate-grant-is-narrow.sh
      hint: "Put the grant in starfleet. List from outpost and kind HTTPRoute, and name the Service probe in to."
    - name: gateway-unchanged
      description: "The Gateway keeps its selector on access=gateway"
      type: file
      source: validation/validate-gateway-unchanged.sh
      hint: "Label the namespace outpost. Do not edit the Gateway."

teardown:
  keepCluster: false

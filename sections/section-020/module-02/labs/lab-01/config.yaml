# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Turn On Layer 7 Load Balancing For A Service (LAB). Graded against the live cluster. UNTESTED.
apiVersion: astrona.io/v1
metadata:
  name: ats-054-lab-020-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    nodes:
      workers: 1
    networking:
      disableDefaultCNI: true
      podSubnet: 10.244.0.0/16
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Install Cilium and create the Starfleet workloads
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: l7-lb-enabled
      description: "The Service probe-lb has the annotation service.cilium.io/lb-l7 set to enabled"
      type: file
      source: validation/validate-l7-lb-enabled.sh
      hint: "Annotate the Service with service.cilium.io/lb-l7=enabled."
    - name: algorithm-least-request
      description: "The Service uses the least_request algorithm"
      type: file
      source: validation/validate-algorithm-least-request.sh
      hint: "Set the annotation service.cilium.io/lb-l7-algorithm to least_request."
    - name: service-answers
      description: "A request to probe-lb from shuttle returns 200"
      type: file
      source: validation/validate-service-answers.sh
      hint: "After you annotate the Service, wait a few seconds and curl http://probe-lb.starfleet.svc/get from shuttle."
    - name: selector-kept
      description: "The Service still selects app=probe on port 80"
      type: file
      source: validation/validate-selector-kept.sh
      hint: "Change only the annotations, not the selector or the port."

teardown:
  keepCluster: false

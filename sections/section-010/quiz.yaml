    - id: b
      text: A `ReferenceGrant` in `starfleet` that allows Secrets from `outpost`
      explanation: Incorrect. The grant lives in the namespace of the referenced object
        and names the namespace of the referring Gateway.
    - id: c
      text: A second listener in the Gateway
      explanation: Incorrect. The grant lives in the namespace of the referenced object
        and names the namespace of the referring Gateway.
    - id: d
      text: An annotation on the Secret
      explanation: Incorrect. The grant lives in the namespace of the referenced object

    explanation: Correct. The matched prefix is replaced, the rest of the path stays.
  - id: ats054-010-m04-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain a mirror
    source_readings:
    - sections/section-010/module-04/course-03-url-rewrite-and-request-mirroring.md
    prompt: What does the client receive from a RequestMirror filter?
    options:
    - id: a
      text: The answer of the mirror backend.
      explanation: Incorrect. The mirror copy is sent and its answer is dropped.
    - id: b
      text: The answer of the main backend only.
      explanation: Correct. The mirror copy is sent and its answer is dropped.
    - id: c
      text: Both answers merged.
      explanation: Incorrect. The mirror copy is sent and its answer is dropped.
    - id: d
      text: An error if the mirror fails.
      explanation: Incorrect. The mirror copy is sent and its answer is dropped.
    correct_option: b
    explanation: Correct. The mirror copy is sent and its answer is dropped.
  - id: ats054-010-m04-q09
    type: single_choice
    difficulty: beginner
    learning_objective: Compute a weight share
    source_readings:
    - sections/section-010/module-04/course-04-weighted-backends-for-canary-and-blue-green.md
    prompt: Backends have weights 90 and 10. What share does the second one get?
    options:
    - id: a
      text: 10 percent
      explanation: Correct. The share is weight divided by the sum of all weights.
    - id: b
      text: 90 percent
      explanation: Incorrect. The share is weight divided by the sum of all weights.
    - id: c
      text: 50 percent
      explanation: Incorrect. The share is weight divided by the sum of all weights.
    - id: d
      text: 1 percent
      explanation: Incorrect. The share is weight divided by the sum of all weights.
    correct_option: a
    explanation: Correct. The share is weight divided by the sum of all weights.
  - id: ats054-010-m04-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: Roll back a canary
    source_readings:
    - sections/section-010/module-04/course-04-weighted-backends-for-canary-and-blue-green.md
    prompt: What is the fastest rollback of a weighted canary?
    options:
    - id: a
      text: Delete the Gateway.
      explanation: Incorrect. Weight 0 sends no traffic and needs no pod restart.
    - id: b
      text: Set the canary weight to 0 and apply again.
      explanation: Correct. Weight 0 sends no traffic and needs no pod restart.
    - id: c
      text: Restart the canary pods.
      explanation: Incorrect. Weight 0 sends no traffic and needs no pod restart.
    - id: d
      text: Remove the GatewayClass.
      explanation: Incorrect. Weight 0 sends no traffic and needs no pod restart.
    correct_option: b
    explanation: Correct. Weight 0 sends no traffic and needs no pod restart.

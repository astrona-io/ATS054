  - id: ats054-010-m03-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain SNI
    source_readings:
    - sections/section-010/module-03/course-02-https-listeners-and-certificates.md
    prompt: Why does `curl -k https://NODE_IP:PORT/` fail to select the certificate
      for a host listener?
    options:
    - id: a
      text: The client sends no SNI for an IP address, so use `--resolve` with the host
        name.
      explanation: Correct. The proxy selects the certificate from the SNI host name,
        and curl sends none for an IP address.
    - id: b
      text: The Gateway cannot serve HTTPS on a node port.
      explanation: Incorrect. The proxy selects the certificate from the SNI host name,
        and curl sends none for an IP address.
    - id: c
      text: The `-k` flag disables TLS.
      explanation: Incorrect. The proxy selects the certificate from the SNI host name,
        and curl sends none for an IP address.
    - id: d
      text: The route has no `hostnames`.
      explanation: Incorrect. The proxy selects the certificate from the SNI host name,
        and curl sends none for an IP address.
    correct_option: a
    explanation: Correct. The proxy selects the certificate from the SNI host name,
      and curl sends none for an IP address.
  - id: ats054-010-m03-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose passthrough
    source_readings:
    - sections/section-010/module-03/course-03-tls-passthrough-and-route-kinds.md
    prompt: A backend must keep its private key and see the client certificate. Which
      listener setup fits?
    options:
    - id: a
      text: "`HTTPS` listener with `Terminate`"
      explanation: Incorrect. Passthrough forwards the encrypted stream, routed by SNI
        with a TLSRoute.
    - id: b
      text: "`TLS` listener with `Passthrough` and a `TLSRoute`"
      explanation: Correct. Passthrough forwards the encrypted stream, routed by SNI
        with a TLSRoute.
    - id: c
      text: "`HTTP` listener with an `HTTPRoute`"
      explanation: Incorrect. Passthrough forwards the encrypted stream, routed by SNI
        with a TLSRoute.
    - id: d
      text: "`UDP` listener with a `GRPCRoute`"
      explanation: Incorrect. Passthrough forwards the encrypted stream, routed by SNI
        with a TLSRoute.
    correct_option: b
    explanation: Correct. Passthrough forwards the encrypted stream, routed by SNI with
      a TLSRoute.
  - id: ats054-010-m03-q08
    type: single_choice
    difficulty: advanced
    learning_objective: State the limit of passthrough
    source_readings:
    - sections/section-010/module-03/course-03-tls-passthrough-and-route-kinds.md
    prompt: What can a Gateway NOT do for traffic in `Passthrough` mode?
    options:
    - id: a
      text: Select the backend by SNI host name.
      explanation: Incorrect. The request is encrypted, so the Gateway cannot read paths,
        headers or methods.
    - id: b
      text: Route by path or header.
      explanation: Correct. The request is encrypted, so the Gateway cannot read paths,
        headers or methods.
    - id: c
      text: Forward the connection to a Service.
      explanation: Incorrect. The request is encrypted, so the Gateway cannot read paths,
        headers or methods.
    - id: d
      text: Count the connection.
      explanation: Incorrect. The request is encrypted, so the Gateway cannot read paths,
        headers or methods.
    correct_option: b
    explanation: Correct. The request is encrypted, so the Gateway cannot read paths,
      headers or methods.
  - id: ats054-010-m03-q09
    type: single_choice
    difficulty: beginner
    learning_objective: Read the attached routes
    source_readings:
    - sections/section-010/module-03/course-04-reading-listener-status.md
    prompt: 'A listener shows `attachedRoutes: 0` after you applied a route. What does
      this tell you?'
    options:
    - id: a
      text: The listener is healthy and idle.
      explanation: Incorrect. attachedRoutes counts the routes that attached to the
        listener.
    - id: b
      text: No route reached this listener, so check sectionName, namespace and host
        names.
      explanation: Correct. attachedRoutes counts the routes that attached to the listener.
    - id: c
      text: The certificate expired.
      explanation: Incorrect. attachedRoutes counts the routes that attached to the
        listener.
    - id: d
      text: The backend Service has no pods.
      explanation: Incorrect. attachedRoutes counts the routes that attached to the
        listener.
    correct_option: b
    explanation: Correct. attachedRoutes counts the routes that attached to the listener.
  - id: ats054-010-m03-q10
    type: single_choice
    difficulty: advanced
    learning_objective: Order the status checks
    source_readings:
    - sections/section-010/module-03/course-04-reading-listener-status.md
    prompt: A route does not work. In which order do you read the status to find the
      cause fastest?
    options:
    - id: a
      text: Backend pods, route, listener, Gateway
      explanation: Incorrect. Read from the outside in. The first False condition is
        the one to fix, and later ones follow from it.
    - id: b
      text: GatewayClass, Gateway, listener, route
      explanation: Correct. Read from the outside in. The first False condition is the
        one to fix, and later ones follow from it.
    - id: c
      text: Route, backend pods, GatewayClass, Gateway
      explanation: Incorrect. Read from the outside in. The first False condition is
        the one to fix, and later ones follow from it.
    - id: d
      text: Listener, GatewayClass, route, Gateway
      explanation: Incorrect. Read from the outside in. The first False condition is
        the one to fix, and later ones follow from it.
    correct_option: b
    explanation: Correct. Read from the outside in. The first False condition is the
      one to fix, and later ones follow from it.

  - id: ats054-010-m04-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Name the match types
    source_readings:
    - sections/section-010/module-04/course-01-request-matching-and-rule-precedence.md
    prompt: Which are the four request fields an HTTPRoute match can use?
    options:
    - id: a
      text: path, headers, queryParams, method
      explanation: Correct. A match combines path, headers, queryParams and method.
    - id: b
      text: path, body, cookies, method
      explanation: Incorrect. A match combines path, headers, queryParams and method.
    - id: c
      text: host, port, scheme, method
      explanation: Incorrect. A match combines path, headers, queryParams and method.
    - id: d
      text: path, headers, labels, namespace
      explanation: Incorrect. A match combines path, headers, queryParams and method.
    correct_option: a
    explanation: Correct. A match combines path, headers, queryParams and method.
  - id: ats054-010-m04-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: Apply precedence
    source_readings:
    - sections/section-010/module-04/course-01-request-matching-and-rule-precedence.md
    prompt: A request matches an Exact path rule and a header rule. Which rule wins?
    options:
    - id: a
      text: The header rule, because it is listed later.
      explanation: Incorrect. The most specific path wins before method, headers and
        query parameters are compared.
    - id: b
      text: The Exact path rule, because path ranks first.
      explanation: Correct. The most specific path wins before method, headers and query
        parameters are compared.
    - id: c
      text: Neither, the route is rejected.
      explanation: Incorrect. The most specific path wins before method, headers and
        query parameters are compared.
    - id: d
      text: Both are applied in turn.
      explanation: Incorrect. The most specific path wins before method, headers and
        query parameters are compared.
    correct_option: b
    explanation: Correct. The most specific path wins before method, headers and query
      parameters are compared.
  - id: ats054-010-m04-q03
    type: single_choice
    difficulty: beginner
    learning_objective: Read a default rule
    source_readings:
    - sections/section-010/module-04/course-01-request-matching-and-rule-precedence.md
    prompt: What does a rule without `matches` do?
    options:
    - id: a
      text: It matches nothing.
      explanation: Incorrect. A rule without matches is the same as a prefix match on
        /.
    - id: b
      text: It matches every request like a PathPrefix on /.
      explanation: Correct. A rule without matches is the same as a prefix match on
        /.
    - id: c
      text: It is rejected by the Gateway.
      explanation: Incorrect. A rule without matches is the same as a prefix match on
        /.
    - id: d
      text: It matches only GET requests.
      explanation: Incorrect. A rule without matches is the same as a prefix match on
        /.
    correct_option: b
    explanation: Correct. A rule without matches is the same as a prefix match on /.
  - id: ats054-010-m04-q04
    type: single_choice
    difficulty: beginner
    learning_objective: Choose set or add
    source_readings:
    - sections/section-010/module-04/course-02-header-modifiers-and-redirects.md
    prompt: Which header modifier field replaces a header value or creates the header?
    options:
    - id: a
      text: "`add`"
      explanation: Incorrect. set replaces or creates, add appends a value, remove deletes
        by name.
    - id: b
      text: "`set`"
      explanation: Correct. set replaces or creates, add appends a value, remove deletes
        by name.
    - id: c
      text: "`remove`"
      explanation: Incorrect. set replaces or creates, add appends a value, remove deletes
        by name.
    - id: d
      text: "`replace`"
      explanation: Incorrect. set replaces or creates, add appends a value, remove deletes
        by name.
    correct_option: b
    explanation: Correct. set replaces or creates, add appends a value, remove deletes
      by name.
  - id: ats054-010-m04-q05

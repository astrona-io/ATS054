# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats054-010
course_id: ATS054
exam_code: CCA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Know How to use Ingress or Gateway API for Ingress Routing"
questions:
  - id: ats054-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Enable the Cilium Ingress controller and name its prerequisites"
    source_readings:
      - sections/section-010/module-01/course-01-the-cilium-ingress-controller.md
    prompt: "A cluster runs Cilium with kube-proxy still handling Services. You set `ingressController.enabled=true` and create an Ingress with `ingressClassName: cilium`. Nothing is served. Which prerequisite is missing?"
    options:
      - id: a
        text: "The Gateway API CRDs must be installed."
        explanation: "The Ingress controller does not use the Gateway API CRDs."
      - id: b
        text: "Kube-proxy replacement: `kubeProxyReplacement=true` must be set."
        explanation: "Correct. The Cilium Ingress controller needs kube-proxy replacement and the L7 proxy."
      - id: c
        text: "An external load balancer controller must be installed."
        explanation: "The controller creates the Service, but a missing load balancer does not stop Envoy from serving on the node port."
      - id: d
        text: "The Ingress must be in `kube-system`."
        explanation: "Ingress resources can be in any namespace."
    correct_option: b
    explanation: "Correct. The Cilium Ingress controller needs kube-proxy replacement and the L7 proxy."

  - id: ats054-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain which component creates the Service for an Ingress"
    source_readings:
      - sections/section-010/module-01/course-01-the-cilium-ingress-controller.md
    prompt: "You apply an Ingress named `scout` in `starfleet` in dedicated mode. A Service `cilium-ingress-scout` appears. What created it?"
    options:
      - id: a
        text: "The kube-controller-manager."
        explanation: "It creates Endpoints for Services, not Services for Ingress resources."
      - id: b
        text: "Envoy on the node."
        explanation: "Envoy receives configuration and forwards requests. It does not create Kubernetes objects."
      - id: c
        text: "The Cilium operator, in response to the Ingress."
        explanation: "Correct. The operator creates the Service and the `CiliumEnvoyConfig` for each Ingress."
      - id: d
        text: "The shuttle pod."
        explanation: "Client pods do not create Services."
    correct_option: c
    explanation: "Correct. The operator creates the Service and the `CiliumEnvoyConfig` for each Ingress."

  - id: ats054-010-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe dedicated and shared load balancer mode"
    source_readings:
      - sections/section-010/module-01/course-01-the-cilium-ingress-controller.md
    prompt: "Two Ingress resources use overlapping path prefixes and conflict when Cilium serves both on one address. Which setting avoids the conflict?"
    options:
      - id: a
        text: "`ingressController.loadbalancerMode=dedicated`, or the annotation `ingress.cilium.io/loadbalancer-mode: dedicated` on one Ingress."
        explanation: "Correct. Each Ingress then has its own Service, address and routing table."
      - id: b
        text: "`ingressController.loadbalancerMode=shared`."
        explanation: "Shared mode puts all Ingress resources on one Service, which is where conflicts occur."
      - id: c
        text: "Set `kubeProxyReplacement=false`."
        explanation: "This disables a prerequisite and does not separate the Ingress resources."
      - id: d
        text: "Delete the IngressClass."
        explanation: "Without the class, Cilium ignores the Ingress resources."
    correct_option: a
    explanation: "Correct. Each Ingress then has its own Service, address and routing table."

  - id: ats054-010-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the Gateway API resources and the owner of each"
    source_readings:
      - sections/section-010/module-01/course-02-gateway-api-resources-in-cilium.md
    prompt: "Which resource defines the listener port and the namespaces that may attach routes?"
    options:
      - id: a
        text: "The `HTTPRoute`."
        explanation: "The route holds matching rules and backends, and it attaches to a Gateway."
      - id: b
        text: "The `GatewayClass`."
        explanation: "The class names the controller. It holds no listeners."
      - id: c
        text: "The `IngressClass`."
        explanation: "It belongs to the Ingress API."
      - id: d
        text: "The `Gateway`, through `listeners` and `allowedRoutes`."
        explanation: "Correct. The platform team owns it."
    correct_option: d
    explanation: "Correct. The platform team owns it."

  - id: ats054-010-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Install the prerequisites for the Cilium Gateway API controller"
    source_readings:
      - sections/section-010/module-01/course-02-gateway-api-resources-in-cilium.md
    prompt: "You enable `gatewayAPI.enabled=true` on a running cluster, but a Gateway of class `cilium` is never programmed. The CRDs were installed after the operator started. What do you do?"
    options:
      - id: a
        text: "Create a second GatewayClass named `cilium-2`."
        explanation: "The class is not the problem."
      - id: b
        text: "Restart `deployment/cilium-operator` and `daemonset/cilium` so they register the CRD watches."
        explanation: "Correct. The operator registers its watches at start, so the CRDs must exist then."
      - id: c
        text: "Set `ingressController.enabled=true`."
        explanation: "This enables a different controller."
      - id: d
        text: "Delete the Gateway CRDs."
        explanation: "The controller needs them."
    correct_option: b
    explanation: "Correct. The operator registers its watches at start, so the CRDs must exist then."

  - id: ats054-010-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read HTTPRoute status conditions"
    source_readings:
      - sections/section-010/module-01/course-03-matching-splitting-and-debugging-routes.md
    prompt: "An HTTPRoute shows `Accepted=False` with the reason `NotAllowedByListeners`. What is wrong?"
    options:
      - id: a
        text: "The backend Service does not exist."
        explanation: "That gives `ResolvedRefs=False` with `BackendNotFound`."
      - id: b
        text: "The weight of a backend is zero."
        explanation: "Weights do not affect attachment."
      - id: c
        text: "The listener of the Gateway does not allow routes from the namespace of the route."
        explanation: "Correct. The `allowedRoutes` field of the listener decides."
      - id: d
        text: "The `Host` header of the request is wrong."
        explanation: "A wrong header gives a `404` at request time. It does not change the status of the route."
    correct_option: c
    explanation: "Correct. The `allowedRoutes` field of the listener decides."

  - id: ats054-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Split traffic with backend weights"
    source_readings:
      - sections/section-010/module-01/course-03-matching-splitting-and-debugging-routes.md
    prompt: "Two backendRefs have `weight: 3` and `weight: 1`. What share of requests does the second backend receive?"
    options:
      - id: a
        text: "About 25 percent."
        explanation: "Correct. The share is the weight divided by the sum of the weights, 1 of 4."
      - id: b
        text: "1 percent."
        explanation: "Weights are relative, not percentages."
      - id: c
        text: "33 percent."
        explanation: "This would be weights of 2 and 1."
      - id: d
        text: "50 percent."
        explanation: "This needs equal weights."
    correct_option: a
    explanation: "Correct. The share is the weight divided by the sum of the weights, 1 of 4."

  - id: ats054-010-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Reach a Gateway on a cluster without a load balancer"
    source_readings:
      - sections/section-010/module-01/course-02-gateway-api-resources-in-cilium.md
    prompt: "On a kind cluster the Gateway `fleet` shows no external address. How does a client pod reach it?"
    options:
      - id: a
        text: "Send the request to the cluster IP of the GatewayClass."
        explanation: "A GatewayClass has no IP address."
      - id: b
        text: "Send the request to the Service `scout` directly with the header `Host`."
        explanation: "This bypasses the Gateway."
      - id: c
        text: "Wait until the Gateway shows an address. It is always assigned."
        explanation: "Without a load balancer implementation, the address stays pending."
      - id: d
        text: "Send the request to the node IP address and the node port of the Service `cilium-gateway-fleet`."
        explanation: "Correct. The generated Service has a node port on every node even when no load balancer assigns an address."
    correct_option: d
    explanation: "Correct. The generated Service has a node port on every node even when no load balancer assigns an address."

  - id: ats054-010-m02-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Name the Service that fronts a dedicated Ingress
    source_readings:
    - sections/section-010/module-02/course-01-shared-and-dedicated-entry-points.md
    prompt: The Ingress `scout` in `starfleet` is served in dedicated mode. Which Service
      carries its entry point?
    options:
    - id: a
      text: "`cilium-ingress` in `kube-system`"
      explanation: Incorrect. Dedicated mode creates one Service per Ingress, named
        cilium-ingress- followed by the Ingress name, in the Ingress namespace.
    - id: b
      text: "`cilium-ingress-scout` in `starfleet`"
      explanation: Correct. Dedicated mode creates one Service per Ingress, named cilium-ingress-
        followed by the Ingress name, in the Ingress namespace.
    - id: c
      text: "`scout` in `starfleet`"
      explanation: Incorrect. Dedicated mode creates one Service per Ingress, named
        cilium-ingress- followed by the Ingress name, in the Ingress namespace.
    - id: d
      text: "`cilium-gateway-scout` in `starfleet`"
      explanation: Incorrect. Dedicated mode creates one Service per Ingress, named
        cilium-ingress- followed by the Ingress name, in the Ingress namespace.
    correct_option: b
    explanation: Correct. Dedicated mode creates one Service per Ingress, named cilium-ingress-
      followed by the Ingress name, in the Ingress namespace.
  - id: ats054-010-m02-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: Set the load balancer mode for one Ingress
    source_readings:
    - sections/section-010/module-02/course-01-shared-and-dedicated-entry-points.md
    prompt: One Ingress must use the shared Service while the Helm value says `dedicated`.
      What do you change?
    options:
    - id: a
      text: 'Set the annotation `ingress.cilium.io/loadbalancer-mode: shared` on that
        Ingress.'
      explanation: Correct. The annotation overrides the Helm value for one Ingress.
    - id: b
      text: 'Set `ingressClassName: shared` on that Ingress.'
      explanation: Incorrect. The annotation overrides the Helm value for one Ingress.
    - id: c
      text: Delete the IngressClass `cilium` and create it again.
      explanation: Incorrect. The annotation overrides the Helm value for one Ingress.
    - id: d
      text: 'Set `externalTrafficPolicy: Local` on the Ingress.'
      explanation: Incorrect. The annotation overrides the Helm value for one Ingress.
    correct_option: a
    explanation: Correct. The annotation overrides the Helm value for one Ingress.
  - id: ats054-010-m02-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: Choose the Service type of a dedicated entry point
    source_readings:
    - sections/section-010/module-02/course-01-shared-and-dedicated-entry-points.md
    prompt: A bare-metal cluster has no load balancer controller. How do you make one
      dedicated Ingress use a node port Service?
    options:
    - id: a
      text: Set `ingressController.service.type=NodePort`, which changes every dedicated
        Ingress.
      explanation: Incorrect. The annotation sets the type for one dedicated Ingress.
        The Helm value sets the type of the shared Service.
    - id: b
      text: 'Set the annotation `ingress.cilium.io/service-type: NodePort` on that Ingress.'
      explanation: Correct. The annotation sets the type for one dedicated Ingress.
        The Helm value sets the type of the shared Service.
    - id: c
      text: 'Add `type: NodePort` under `spec` of the Ingress.'
      explanation: Incorrect. The annotation sets the type for one dedicated Ingress.
        The Helm value sets the type of the shared Service.
    - id: d
      text: 'Nothing: an Ingress never gets a node port.'
      explanation: Incorrect. The annotation sets the type for one dedicated Ingress.
        The Helm value sets the type of the shared Service.
    correct_option: b
    explanation: Correct. The annotation sets the type for one dedicated Ingress. The
      Helm value sets the type of the shared Service.
  - id: ats054-010-m02-q04
    type: single_choice
    difficulty: beginner
    learning_objective: Predict a path type match
    source_readings:
    - sections/section-010/module-02/course-02-host-and-path-matching.md
    prompt: 'A rule has `path: /status` and `pathType: Prefix`. Which request path does
      it NOT match?'
    options:
    - id: a
      text: "`/status`"
      explanation: Incorrect. Prefix matches whole path elements, so /statusx is a different
        element.
    - id: b
      text: "`/status/200`"
      explanation: Incorrect. Prefix matches whole path elements, so /statusx is a different
        element.
    - id: c
      text: "`/statusx`"
      explanation: Correct. Prefix matches whole path elements, so /statusx is a different
        element.
    - id: d
      text: "`/status/`"
      explanation: Incorrect. Prefix matches whole path elements, so /statusx is a different
        element.
    correct_option: c
    explanation: Correct. Prefix matches whole path elements, so /statusx is a different
      element.
  - id: ats054-010-m02-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: Predict which rule Envoy chooses
    source_readings:
    - sections/section-010/module-02/course-02-host-and-path-matching.md
    prompt: One host has an `Exact` rule for `/get` to `probe` and a `Prefix` rule for
      `/` to `scout`. Where does the request `/get/extra` go?
    options:
    - id: a
      text: To `probe`, because the Exact rule is first in the file.
      explanation: Incorrect. Exact matches only the same path. The request falls to
        the Prefix rule for /.
    - id: b
      text: To `probe`, because /get is a prefix of /get/extra.
      explanation: Incorrect. Exact matches only the same path. The request falls to
        the Prefix rule for /.
    - id: c
      text: To `scout`, because the Exact rule does not match and the catch-all does.
      explanation: Correct. Exact matches only the same path. The request falls to the
        Prefix rule for /.
    - id: d
      text: It returns a 404 from Envoy, because two rules overlap.
      explanation: Incorrect. Exact matches only the same path. The request falls to
        the Prefix rule for /.
    correct_option: c
    explanation: Correct. Exact matches only the same path. The request falls to the
      Prefix rule for /.
  - id: ats054-010-m02-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain ImplementationSpecific in Cilium
    source_readings:
    - sections/section-010/module-02/course-02-host-and-path-matching.md
    prompt: What does Cilium do with the value of a path whose `pathType` is `ImplementationSpecific`?
    options:
    - id: a
      text: It treats the value as a regular expression.
      explanation: Correct. In Cilium the value is a regular expression, so the manifest
        is not portable to every controller.
    - id: b
      text: It treats the value as an exact path.
      explanation: Incorrect. In Cilium the value is a regular expression, so the manifest
        is not portable to every controller.
    - id: c
      text: It ignores the rule.
      explanation: Incorrect. In Cilium the value is a regular expression, so the manifest
        is not portable to every controller.
    - id: d
      text: It treats the value as a path prefix with a wildcard at the end.
      explanation: Incorrect. In Cilium the value is a regular expression, so the manifest
        is not portable to every controller.
    correct_option: a
    explanation: Correct. In Cilium the value is a regular expression, so the manifest
      is not portable to every controller.
  - id: ats054-010-m02-q07
    type: single_choice
    difficulty: beginner
    learning_objective: Name the Secret type for TLS
    source_readings:
    - sections/section-010/module-02/course-03-tls-termination-with-a-secret.md
    prompt: Which Secret type and keys does an Ingress `tls` entry need?
    options:
    - id: a
      text: "`Opaque` with the keys `cert` and `key`"
      explanation: Incorrect. A TLS Secret has the type kubernetes.io/tls and holds
        tls.crt and tls.key.
    - id: b
      text: "`kubernetes.io/tls` with the keys `tls.crt` and `tls.key`"
      explanation: Correct. A TLS Secret has the type kubernetes.io/tls and holds tls.crt
        and tls.key.
    - id: c
      text: "`kubernetes.io/dockerconfigjson` with the key `.dockerconfigjson`"
      explanation: Incorrect. A TLS Secret has the type kubernetes.io/tls and holds
        tls.crt and tls.key.
    - id: d
      text: "`kubernetes.io/basic-auth` with the keys `username` and `password`"
      explanation: Incorrect. A TLS Secret has the type kubernetes.io/tls and holds
        tls.crt and tls.key.
    correct_option: b
    explanation: Correct. A TLS Secret has the type kubernetes.io/tls and holds tls.crt
      and tls.key.
  - id: ats054-010-m02-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: Test HTTPS to a node port
    source_readings:
    - sections/section-010/module-02/course-03-tls-termination-with-a-secret.md
    prompt: You test an HTTPS Ingress for `scout.example.com` with `curl -k https://NODE_IP:NODE_PORT/`
      and the handshake fails. What is the most likely cause and fix?
    options:
    - id: a
      text: The certificate is self-signed. Remove the `-k` flag.
      explanation: Incorrect. Envoy chooses the certificate by SNI. curl sends no SNI
        for an IP address.
    - id: b
      text: The client sent no SNI because it connected to an IP address. Use `--resolve
        scout.example.com:NODE_PORT:NODE_IP` and the host name in the URL.
      explanation: Correct. Envoy chooses the certificate by SNI. curl sends no SNI
        for an IP address.
    - id: c
      text: 'The Ingress needs `pathType: Exact`.'
      explanation: Incorrect. Envoy chooses the certificate by SNI. curl sends no SNI
        for an IP address.
    - id: d
      text: The node port is the HTTP port. Switch to the Service port 80.
      explanation: Incorrect. Envoy chooses the certificate by SNI. curl sends no SNI
        for an IP address.
    correct_option: b
    explanation: Correct. Envoy chooses the certificate by SNI. curl sends no SNI for
      an IP address.
  - id: ats054-010-m02-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: Describe the default HTTP behaviour for a TLS host
    source_readings:
    - sections/section-010/module-02/course-03-tls-termination-with-a-secret.md
    prompt: A host has a `tls` entry and Cilium uses the default settings. What does
      a plain HTTP request for that host receive?
    options:
    - id: a
      text: A redirect to HTTPS.
      explanation: Correct. enforceHttps is on by default, so Envoy redirects to HTTPS.
        The annotation ingress.cilium.io/force-ssl-redirect can override it for one
        Ingress.
    - id: b
      text: The backend reply over HTTP.
      explanation: Incorrect. enforceHttps is on by default, so Envoy redirects to HTTPS.
        The annotation ingress.cilium.io/force-ssl-redirect can override it for one
        Ingress.
    - id: c
      text: A reset of the connection.
      explanation: Incorrect. enforceHttps is on by default, so Envoy redirects to HTTPS.
        The annotation ingress.cilium.io/force-ssl-redirect can override it for one
        Ingress.
    - id: d
      text: A reply with status 404.
      explanation: Incorrect. enforceHttps is on by default, so Envoy redirects to HTTPS.
        The annotation ingress.cilium.io/force-ssl-redirect can override it for one
        Ingress.
    correct_option: a
    explanation: Correct. enforceHttps is on by default, so Envoy redirects to HTTPS.
      The annotation ingress.cilium.io/force-ssl-redirect can override it for one Ingress.
  - id: ats054-010-m02-q10
    type: single_choice
    difficulty: advanced
    learning_objective: Choose the setting for a gRPC backend
    source_readings:
    - sections/section-010/module-02/course-04-reaching-the-entry-point-from-outside.md
    prompt: A gRPC backend behind a Cilium Ingress fails even though the Service exists
      and the route matches. What setting on the backend Service port does gRPC without
      TLS need?
    options:
    - id: a
      text: "`protocol: UDP`"
      explanation: Incorrect. Envoy talks HTTP/2 to the backend only when the Service
        port says so with appProtocol kubernetes.io/h2c.
    - id: b
      text: "`appProtocol: kubernetes.io/h2c`"
      explanation: Correct. Envoy talks HTTP/2 to the backend only when the Service
        port says so with appProtocol kubernetes.io/h2c.
    - id: c
      text: "`targetPort: 443`"
      explanation: Incorrect. Envoy talks HTTP/2 to the backend only when the Service
        port says so with appProtocol kubernetes.io/h2c.
    - id: d
      text: "`sessionAffinity: ClientIP`"
      explanation: Incorrect. Envoy talks HTTP/2 to the backend only when the Service
        port says so with appProtocol kubernetes.io/h2c.
    correct_option: b
    explanation: Correct. Envoy talks HTTP/2 to the backend only when the Service port
      says so with appProtocol kubernetes.io/h2c.

  - id: ats054-010-m03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: Use sectionName
    source_readings:
    - sections/section-010/module-03/course-01-listeners-and-attachment.md
    prompt: A Gateway has the listeners `scout` and `probe`. Which field attaches an
      HTTPRoute to only the listener `scout`?
    options:
    - id: a
      text: "`hostnames` in the route"
      explanation: Incorrect. sectionName in parentRefs selects one listener of the
        parent Gateway.
    - id: b
      text: "`sectionName` in `parentRefs`"
      explanation: Correct. sectionName in parentRefs selects one listener of the parent
        Gateway.
    - id: c
      text: "`allowedRoutes` in the route"
      explanation: Incorrect. sectionName in parentRefs selects one listener of the
        parent Gateway.
    - id: d
      text: "`gatewayClassName` in the route"
      explanation: Incorrect. sectionName in parentRefs selects one listener of the
        parent Gateway.
    correct_option: b
    explanation: Correct. sectionName in parentRefs selects one listener of the parent
      Gateway.
  - id: ats054-010-m03-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: Explain host name overlap
    source_readings:
    - sections/section-010/module-03/course-01-listeners-and-attachment.md
    prompt: 'A route for `probe.example.com` attaches to a listener with `hostname:
      scout.example.com`. What happens?'
    options:
    - id: a
      text: The route is accepted and serves both names.
      explanation: Incorrect. A route is accepted only when its host names overlap with
        the listener host name.
    - id: b
      text: The route is not accepted, because the host names do not overlap.
      explanation: Correct. A route is accepted only when its host names overlap with
        the listener host name.
    - id: c
      text: The Gateway changes the listener host name.
      explanation: Incorrect. A route is accepted only when its host names overlap with
        the listener host name.
    - id: d
      text: The route is accepted but receives no traffic.
      explanation: Incorrect. A route is accepted only when its host names overlap with
        the listener host name.
    correct_option: b
    explanation: Correct. A route is accepted only when its host names overlap with
      the listener host name.
  - id: ats054-010-m03-q03
    type: single_choice
    difficulty: beginner
    learning_objective: Limit routes by namespace
    source_readings:
    - sections/section-010/module-03/course-01-listeners-and-attachment.md
    prompt: Which `allowedRoutes.namespaces.from` value lets only routes from the namespace
      of the Gateway attach?
    options:
    - id: a
      text: "`All`"
      explanation: Incorrect. Same allows routes from the namespace of the Gateway.
        All and Selector allow others.
    - id: b
      text: "`Selector`"
      explanation: Incorrect. Same allows routes from the namespace of the Gateway.
        All and Selector allow others.
    - id: c
      text: "`Same`"
      explanation: Correct. Same allows routes from the namespace of the Gateway. All
        and Selector allow others.
    - id: d
      text: "`Local`"
      explanation: Incorrect. Same allows routes from the namespace of the Gateway.
        All and Selector allow others.
    correct_option: c
    explanation: Correct. Same allows routes from the namespace of the Gateway. All
      and Selector allow others.
  - id: ats054-010-m03-q04
    type: single_choice
    difficulty: beginner
    learning_objective: Name the Terminate fields
    source_readings:
    - sections/section-010/module-03/course-02-https-listeners-and-certificates.md
    prompt: Which listener fields serve HTTPS with a certificate from a Secret?
    options:
    - id: a
      text: "`tls.mode: Terminate` and `tls.certificateRefs`"
      explanation: Correct. An HTTPS listener uses tls.mode Terminate and names the
        Secret in certificateRefs.
    - id: b
      text: "`protocol: TCP` and `secretName`"
      explanation: Incorrect. An HTTPS listener uses tls.mode Terminate and names the
        Secret in certificateRefs.
    - id: c
      text: "`tls.mode: Passthrough` and `certificateRefs`"
      explanation: Incorrect. An HTTPS listener uses tls.mode Terminate and names the
        Secret in certificateRefs.
    - id: d
      text: "`hostname` and `caBundle`"
      explanation: Incorrect. An HTTPS listener uses tls.mode Terminate and names the
        Secret in certificateRefs.
    correct_option: a
    explanation: Correct. An HTTPS listener uses tls.mode Terminate and names the Secret
      in certificateRefs.
  - id: ats054-010-m03-q05

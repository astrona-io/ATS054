# Starting state: an Ingress without a class, a Gateway in the namespace `edge`
# that only accepts routes from labelled namespaces, and a probe route that cannot attach.
apiVersion: v1
kind: Namespace
metadata:
  name: edge
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scout
  namespace: starfleet
spec:
  rules:
    - host: scout.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scout
                port:
                  number: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge-gw
  namespace: edge
spec:
  gatewayClassName: cilium
  listeners:
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              access: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: probe
  namespace: starfleet
spec:
  parentRefs:
    - name: edge-gw
      namespace: edge
  hostnames:
    - probe.example.com
  rules:
    - backendRefs:
        - name: probe
          port: 80

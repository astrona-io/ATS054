    difficulty: intermediate
    learning_objective: Combine redirect and backend
    source_readings:
    - sections/section-010/module-04/course-02-header-modifiers-and-redirects.md
    prompt: Why does a rule with RequestRedirect not list backendRefs?
    options:
    - id: a
      text: backendRefs is deprecated.
      explanation: Incorrect. A RequestRedirect rule answers by itself and cannot hold
        backendRefs.
    - id: b
      text: The redirect is the whole answer, and the two cannot share a rule.
      explanation: Correct. A RequestRedirect rule answers by itself and cannot hold
        backendRefs.
    - id: c
      text: The backend is chosen by the Service.
      explanation: Incorrect. A RequestRedirect rule answers by itself and cannot hold
        backendRefs.
    - id: d
      text: Redirects only work on HTTPS.
      explanation: Incorrect. A RequestRedirect rule answers by itself and cannot hold
        backendRefs.
    correct_option: b
    explanation: Correct. A RequestRedirect rule answers by itself and cannot hold backendRefs.
  - id: ats054-010-m04-q06
    type: single_choice
    difficulty: beginner
    learning_objective: Pick a status code
    source_readings:
    - sections/section-010/module-04/course-02-header-modifiers-and-redirects.md
    prompt: Which status code means the move is permanent?
    options:
    - id: a
      text: "`302`"
      explanation: Incorrect. 301 is permanent and browsers cache it. 302 is temporary.
    - id: b
      text: "`301`"
      explanation: Correct. 301 is permanent and browsers cache it. 302 is temporary.
    - id: c
      text: "`200`"
      explanation: Incorrect. 301 is permanent and browsers cache it. 302 is temporary.
    - id: d
      text: "`404`"
      explanation: Incorrect. 301 is permanent and browsers cache it. 302 is temporary.
    correct_option: b
    explanation: Correct. 301 is permanent and browsers cache it. 302 is temporary.
  - id: ats054-010-m04-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: Use ReplacePrefixMatch
    source_readings:
    - sections/section-010/module-04/course-03-url-rewrite-and-request-mirroring.md
    prompt: A rule matches PathPrefix /probe with ReplacePrefixMatch /. What does the
      backend receive for /probe/get?
    options:
    - id: a
      text: "/probe/get"
      explanation: Incorrect. The matched prefix is replaced, the rest of the path stays.
    - id: b
      text: "/get"
      explanation: Correct. The matched prefix is replaced, the rest of the path stays.
    - id: c
      text: "/"
      explanation: Incorrect. The matched prefix is replaced, the rest of the path stays.
    - id: d
      text: "/probe"
      explanation: Incorrect. The matched prefix is replaced, the rest of the path stays.
